# traefik.yaml - helm values for the Traefik ingress controller.
#
# install.sh passes this as: helm upgrade --install traefik <chart> -f <this>
# Mirrors josef-hak/kube-sol helm/traefik.yaml: run Traefik as a DaemonSet and
# bind it to host ports 80/443 so the k0rdent UI (and other Ingress/IngressRoute
# services) are reachable on the node's address.
traefik:
  deployment:
    kind: DaemonSet
  ports:
    web:
      port: 8000
      hostPort: 80
    websecure:
      port: 8443
      hostPort: 443
