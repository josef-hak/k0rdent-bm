# management-patch.yaml - strategic merge patch for the kcm Management object.
#
# Enables the in-cluster Ironic stack (cluster-api-provider-metal3 -> ironic
# subchart) and pins its networking to the static `lab` provisioning network.
# Applied by k0rdent-bm-setup.sh via:
#   kubectl patch management kcm --type merge --patch-file <rendered>
# Filled by envsubst from /etc/k0rdent-bm/config.env.
#
# IMPORTANT: `kubectl patch --type merge` REPLACES the whole spec.providers list
# (JSON merge patch does not merge arrays element-by-element). So we must list
# EVERY provider the Management should keep - the default k0rdent set below -
# plus our cluster-api-provider-metal3. Dropping a name here uninstalls it.
#
# Only networking is overridden for metal3. IPA ramdisk + target OS images are
# NOT set here: the ironic 0.5.0 subchart ships correct images_ipa/images_target
# and serves them from its in-cluster httpd. Keys verified against
# charts/ironic 0.5.0 values.
spec:
  providers:
    # --- default k0rdent providers (must be kept; see note above) ------------
    - name: cluster-api-provider-k0sproject-k0smotron
    - name: cluster-api-provider-azure
    - name: cluster-api-provider-vsphere
    - name: cluster-api-provider-aws
    - name: cluster-api-provider-openstack
    - name: cluster-api-provider-docker
    - name: cluster-api-provider-gcp
    - name: cluster-api-provider-ipam
    - name: cluster-api-provider-infoblox
    - name: cluster-api-provider-kubevirt
    - name: projectsveltos
    # --- our bare-metal provider (Ironic on the lab network) -----------------
    - name: cluster-api-provider-metal3
      template: ${PROVIDER_TEMPLATE}
      config:
        global:
          ironic:
            enabled: true
        ironic:
          networking:
            # Ironic runs hostNetwork; bind it + the keepalived VIP to the lab iface.
            interface: ${PROV_BRIDGE}
            ipAddress: ${IRONIC_VIP}
            dhcp:
              rangeBegin: ${DHCP_RANGE_BEGIN}
              rangeEnd: ${DHCP_RANGE_END}
              netmask: ${PROV_NETMASK}
              options:
                - "option:router,${HOST_IP}"
                - "option:dns-server,${IRONIC_VIP}"
                - "option:ntp-server,${IRONIC_VIP}"
